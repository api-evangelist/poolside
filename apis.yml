aid: poolside
name: poolside
description: >-
  poolside builds open-weight foundation models and the systems that refine them
  for agentic software engineering. Its Laguna model family (Laguna XS 2.1, a 33B
  on-device model, and Laguna M.1, a 225B model with a 256K context window) is
  served through an OpenAI-compatible inference API at inference.poolside.ai, the
  hosted Poolside Platform, OpenRouter, and self-managed on-premises / cloud
  Kubernetes deployments (Amazon EKS, OpenShift, upstream Kubernetes). Developers
  work with the models through the `pool` Agent CLI, editor and coding-agent
  integrations (VS Code, JetBrains, Neovim, Zed, Cline, Goose, GitHub Copilot),
  the Agent Client Protocol, MCP servers, and reusable Skills / AGENTS.md
  instructions. poolside targets secure, self-hosted enterprise and government
  software engineering and is backed by SoftBank Vision Fund.
